<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Lists</title>
</head>
<body>
    <p>GeeksforGeeks Course List</p>
    
    <!-- Main unordered list -->
    <ul>
        <!-- List item containing a heading -->
        <li><h3>DSA</h3></li>
        <!-- Nested unordered list -->
        <ul>
            <li>array</li>
            <li>linked list</li>
            <li>stack</li>
            <li>queue</li>
        </ul>
        
        <li><h3>Web Technologies</h3></li>
        <!-- Nested unordered list -->
        <ul>
            <li>html</li>
            <li>css</li>
            <li>java script</li> 
        </ul>
        
        <li><h3>Aptitude</h3></li>
        <li><h3>Gate</h3></li>
        <li><h3>Placement</h3></li>
    </ul>
</body>
</html>
